services:
  redis:
    image: redis:8-alpine
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 1s
      timeout: 3s
      retries: 5
    ports:
      - "6379:6379"

  srh:
    ports:
      - "8079:80"
    image: hiett/serverless-redis-http:latest
    depends_on:
      redis: 
        condition: service_healthy
    env_file: .env.docker
    secrets:
      - SRH_MODE=env 
      - SRH_TOKEN=local_dev_token
      - SRH_CONNECTION_STRING=redis://redis:6379
      - ENABLE_PERFORMANCE=true
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:80 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    depends_on:
      srh:
        condition: service_healthy
    build:
      context: .
      dockerfile: Dockerfile
      secrets:
        - env
    ports: 
      - "3000:3000"
    env_file: .env.docker


secrets:
  env:
    file: .env.docker