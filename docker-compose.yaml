name: tinytag

volumes:
  redis-data:
  db-data:
  db-config:

services:
  redis:
    image: redis:8-alpine
    restart: unless-stopped
    volumes: 
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 1s
      timeout: 3s
      retries: 5
    expose:
      - "6379"
    

  srh:
    expose:
      - "80"
    image: hiett/serverless-redis-http:latest
    restart: unless-stopped
    depends_on:
      redis: 
        condition: service_healthy
    env_file: .env.docker
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:80 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    depends_on:
      srh:
        condition: service_healthy
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
      secrets:
        - env
    ports: 
      - "3000:3000"
    env_file: .env.docker 

  db:
    image: supabase/postgres:17.6.1.136
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    env_file: .env.docker
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf", "-c", "log_min_messages=fatal"]

secrets:
  env:
    file: .env.docker